validator:
  datadir: "/data"
  listen_addr: "0.0.0.0:8547"
  p2p_port: 30303
  min_stake: 10000
  bootnodes:
    - "localhost:30304"  # other validators in devnet

sequencer:
  rpc_url: "http://localhost:8545"
  ws_url: "ws://localhost:8546"

l1:
  rpc_url: "http://localhost:8551"
  chain_id: 1
  staking_contract: "0x0000000000000000000000000000000000000000"

tastescore:
  enabled: true
  api_url: "https://api.insoblokai.io"
  api_key: "${TASTESCORE_API_KEY}"

consensus:
  block_timeout: 2s
  attestation_delay: 200ms
  slashing_enabled: true

sovereignty:
  enabled: true
  xp_decay_rate: 0.005
  attestation_xp: 10
  uptime_bonus_xp: 5
  slash_penalty_xp: 500

adaptive_block:
  enabled: true
  min_gas_limit: 15000000
  max_gas_limit: 60000000
  min_max_tx: 1000
  max_max_tx: 10000

logging:
  level: info
  format: json

metrics:
  enabled: true
  addr: "0.0.0.0:6061"
